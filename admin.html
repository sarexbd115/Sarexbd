<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAREXBD Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4af37;--bg:#0b0b0d;--card:#171719;--line:#333337;--white:#f7f7f7;--muted:#aaaab2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,sans-serif}
header{padding:16px;background:#111;border-bottom:1px solid #493d1c}
main{max-width:1100px;margin:auto;padding:16px}
.logo{font-size:25px;font-weight:bold;color:var(--gold)}
.logo span{color:white}
button{padding:11px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}
.gold{background:var(--gold);color:#111}
.dark{background:#29292d;color:white;border:1px solid #444}
input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;background:#101012;color:white;border:1px solid #45454b;border-radius:8px}
label{font-size:13px;color:#ddd}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product img{width:100%;height:160px;object-fit:cover;border-radius:8px;background:#222}
.product h3{margin:9px 0}
#message{white-space:pre-wrap;color:#f3dc91}
hr{border-color:var(--line)}
@media(max-width:600px){.row,.products{grid-template-columns:1fr}main{padding:10px}}
</style>
</head>
<body>
<header>
 <div class="logo">SAREX<span>BD</span></div>
 <p class="muted">ADMIN · PRODUCTS · ORDERS</p>
 <button id="logout" class="dark hidden">Logout</button>
</header>
<main>
 <section id="login" class="card">
  <h2>Admin Login</h2>
  <form id="loginForm">
   <label>Email</label><input id="email" type="email" required>
   <label>Password</label><input id="password" type="password" required>
   <button class="gold">Login</button>
  </form>
  <p id="loginMessage"></p>
 </section>

 <section id="dashboard" class="hidden">
  <h2>প্রোডাক্ট যোগ / এডিট</h2>
  <div class="card">
   <form id="productForm">
    <input id="productId" type="hidden">
    <label>প্রোডাক্টের নাম</label>
    <input id="name" required placeholder="Premium Leather Wallet">
    <label>বিবরণ</label>
    <textarea id="description" rows="3" placeholder="প্রোডাক্টের বিবরণ"></textarea>
    <div class="row">
     <div><label>দাম (৳)</label><input id="price" type="number" min="0" step="0.01" required></div>
     <div><label>স্টক</label><input id="stock" type="number" min="0" step="1" required></div>
    </div>
    <label>প্রোডাক্টের ছবি</label>
    <input id="image" type="file" accept="image/*">
    <p class="muted">নতুন ছবি না দিলে আগের ছবিই থাকবে।</p>
    <label><input id="active" type="checkbox" checked style="width:auto"> ওয়েবসাইটে দেখাবে</label>
    <p><button class="gold" type="submit">Save Product</button>
    <button class="dark" id="cancelEdit" type="button">নতুন প্রোডাক্ট</button></p>
   </form>
  </div>

  <h2>প্রোডাক্ট তালিকা</h2>
  <button class="dark" id="reloadProducts">Refresh Products</button>
  <div id="productList" class="products"></div>

  <hr>
  <h2>অর্ডার ম্যানেজমেন্ট</h2>
  <button class="dark" id="reloadOrders">Refresh Orders</button>
  <p id="orderMessage" class="muted"></p>
  <div id="orderList"></div>
 </section>
 <p id="message"></p>
</main>

<script>
const URL="https://kkjyhhxkdgcbtwysftjt.supabase.co";
const KEY="sb_publishable_FLYJFyWSJd2-_KVSy_ZMRA_cv9vRKs1";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let products=[];

function money(v){
 return "৳"+(Number(v)||0).toLocaleString("en-US");
}
function showMessage(s){$("message").textContent=s}
function safeImage(url){
 return url||"";
}

async function updateScreen(){
 const {data,error}=await db.auth.getSession();
 if(error){$("loginMessage").textContent=error.message;return}
 const logged=!!data.session;
 $("login").classList.toggle("hidden",logged);
 $("dashboard").classList.toggle("hidden",!logged);
 $("logout").classList.toggle("hidden",!logged);
 if(logged){
  await loadProducts();
  await loadOrders();
 }
}

function resetForm(){
 $("productForm").reset();
 $("productId").value="";
 $("active").checked=true;
 $("image").value="";
}

async function loadProducts(){
 showMessage("প্রোডাক্ট লোড হচ্ছে...");
 const {data,error}=await db.from("products")
  .select("*").order("id",{ascending:false});
 if(error){showMessage("প্রোডাক্ট লোড হয়নি: "+error.message);return}
 products=data||[];
 const list=$("productList");
 list.replaceChildren();
 if(!products.length)list.textContent="এখনো কোনো প্রোডাক্ট নেই।";
 products.forEach(p=>{
  const box=document.createElement("div");
  box.className="card product";
  if(p.image_url){
   const img=document.createElement("img");
   img.src=safeImage(p.image_url);
   img.alt=p.name||"Product";
   img.onerror=()=>img.style.display="none";
   box.appendChild(img);
  }
  const title=document.createElement("h3");
  title.textContent=p.name;box.appendChild(title);
  const price=document.createElement("p");
  price.textContent=money(p.price);box.appendChild(price);
  const stock=document.createElement("p");
  stock.textContent="স্টক: "+p.stock+" · "+(p.active?"Active":"Hidden");
  box.appendChild(stock);
  const edit=document.createElement("button");
  edit.className="gold";edit.textContent="Edit";
  edit.onclick=()=>editProduct(p.id);
  box.appendChild(edit);
  const toggle=document.createElement("button");
  toggle.className="dark";
  toggle.textContent=p.active?"Hide":"Show";
  toggle.onclick=()=>toggleProduct(p);
  box.appendChild(toggle);
  list.appendChild(box);
 });
 showMessage("মোট প্রোডাক্ট: "+products.length);
}

function editProduct(id){
 const p=products.find(x=>String(x.id)===String(id));
 if(!p)return;
 $("productId").value=p.id;
 $("name").value=p.name||"";
 $("description").value=p.description||"";
 $("price").value=p.price||0;
 $("stock").value=p.stock||0;
 $("active").checked=!!p.active;
 $("image").value="";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function toggleProduct(p){
 showMessage("আপডেট হচ্ছে...");
 const {error}=await db.from("products")
  .update({active:!p.active}).eq("id",p.id);
 if(error){showMessage("আপডেট হয়নি: "+error.message);return}
 await loadProducts();
}

$("productForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const button=$("productForm").querySelector('button[type="submit"]');
 button.disabled=true;
 try{
  let imageUrl="";
  const id=$("productId").value;
  const old=products.find(p=>String(p.id)===String(id));
  imageUrl=old?.image_url||"";
  const file=$("image").files[0];

  if(file){
   if(!file.type.startsWith("image/"))throw Error("ছবি ফাইল নির্বাচন করো।");
   if(file.size>5*1024*1024)throw Error("ছবির সাইজ ৫ MB-এর কম রাখো।");
   const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"");
   const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
   const {data:uploaded,error:uploadError}=await db.storage
    .from("product-images").upload(path,file,{
     cacheControl:"3600",upsert:false,contentType:file.type
    });
   if(uploadError)throw uploadError;
   const {data:urlData}=db.storage.from("product-images").getPublicUrl(uploaded.path);
   imageUrl=urlData.publicUrl;
  }

  const product={
   name:$("name").value.trim(),
   description:$("description").value.trim(),
   price:Number($("price").value),
   stock:Number($("stock").value),
   image_url:imageUrl,
   active:$("active").checked
  };
  if(!product.name)throw Error("প্রোডাক্টের নাম দাও।");
  if(product.price<0||product.stock<0)throw Error("দাম বা স্টক ঋণাত্মক হতে পারবে না।");

  let result;
  if(id){
   result=await db.from("products").update(product).eq("id",id);
  }else{
   result=await db.from("products").insert(product);
  }
  if(result.error)throw result.error;
  resetForm();
  showMessage("প্রোডাক্ট সেভ হয়েছে।");
  await loadProducts();
 }catch(err){
  showMessage("সেভ হয়নি: "+(err.message||String(err)));
 }finally{
  button.disabled=false;
 }
});

$("cancelEdit").onclick=resetForm;
$("reloadProducts").onclick=loadProducts;

async function loadOrders(){
 $("orderMessage").textContent="অর্ডার লোড হচ্ছে...";
 const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
 if(error){$("orderMessage").textContent="অর্ডার লোড হয়নি: "+error.message;return}
 const list=$("orderList");
 list.replaceChildren();
 const statuses=["Pending","Confirmed","Shipped","Delivered","Cancelled"];
 (data||[]).forEach(o=>{
  const box=document.createElement("div");
  box.className="card";
  const heading=document.createElement("h3");
  heading.textContent="Order #"+o.id+" — "+(o.customer_name||"");
  box.appendChild(heading);
  const info=document.createElement("p");
  info.textContent="ফোন: "+(o.phone||"")+" | পণ্য: "+(o.product||"")+" | পরিমাণ: "+(o.quantity||1)+" | মোট: "+money(o.total);
  box.appendChild(info);
  const address=document.createElement("p");
  address.textContent="ঠিকানা: "+(o.address||"");
  box.appendChild(address);
  const select=document.createElement("select");
  statuses.forEach(s=>{
   const opt=document.createElement("option");
   opt.value=s;opt.textContent=s;select.appendChild(opt);
  });
  select.value=statuses.includes(o.status)?o.status:"Pending";
  box.appendChild(select);
  const save=document.createElement("button");
  save.className="gold";save.textContent="Save Status";
  save.onclick=async()=>{
   save.disabled=true;
   const {error:updateError}=await db.from("orders")
    .update({status:select.value}).eq("id",o.id);
   save.disabled=false;
   if(updateError){
    $("orderMessage").textContent="স্ট্যাটাস সেভ হয়নি: "+updateError.message;
   }else{
    $("orderMessage").textContent="Order #"+o.id+" আপডেট হয়েছে।";
    await loadOrders();
   }
  };
  box.appendChild(save);
  list.appendChild(box);
 });
 $("orderMessage").textContent="মোট অর্ডার: "+(data||[]).length;
}

$("reloadOrders").onclick=loadOrders;
$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 $("loginMessage").textContent="লগইন হচ্ছে...";
 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 if(error){$("loginMessage").textContent="লগইন হয়নি: "+error.message;return}
 await updateScreen();
});
$("logout").onclick=async()=>{
 await db.auth.signOut();
 await updateScreen();
};
updateScreen();
</script>
</body>
</html>
