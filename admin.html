<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAREXBD Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0907;--panel:#15110c;--line:#3a2d17;--gold:#d4a73c;--gold2:#f0cf7a;--tx:#f3ead7;--mu:#a1927a;--ok:#5fbf6a;--warn:#e0a526;--info:#d98a3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0e0b08;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand b{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:.14em;color:var(--gold2);display:block;line-height:1}
.brand small{color:var(--mu);font-size:11px}
.menu{display:none;background:none;border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:6px 10px;font-size:18px}
.adm{margin-left:auto;color:var(--gold2);font-size:14px}
.wrap{display:flex}
nav{width:210px;flex:none;border-right:1px solid var(--line);padding:14px 10px;background:var(--panel);min-height:calc(100vh - 59px)}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--tx);text-decoration:none;font-size:14px;cursor:pointer;margin-bottom:4px}
nav a small{display:block;color:var(--mu);font-size:11px}
nav a.on{background:#2a2012;color:var(--gold2);border:1px solid var(--line)}
nav a:hover{background:#21190e}
nav a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{flex:1;padding:18px;min-width:0}
h1{font-size:22px;margin-bottom:14px;font-weight:500}
h1 span{color:var(--mu);font-size:14px;margin-left:6px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card small{color:var(--mu);font-size:12px;display:block}
.card b{font-size:28px;color:var(--gold2);font-weight:600;display:block;margin-top:6px}
h2{font-size:16px;color:var(--gold);margin:22px 0 10px;font-weight:600}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
th{color:var(--mu);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid #261d10}
tr:last-child td{border:0}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;color:#17110a;font-weight:600}
.t-ok{background:var(--ok)}.t-w{background:var(--warn)}.t-i{background:var(--info)}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.btn{background:linear-gradient(#e6bc55,#c99a2e);color:#1a1206;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-family:inherit}
.f{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}
.f input,select{width:100%;margin-top:4px;background:#0e0b08;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px}
select{width:auto;margin:0;padding:5px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.gh{background:none;border:1px solid var(--line);color:var(--gold2);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px;margin-right:4px}
.gh.d{color:#e57a6a}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,#c99a2e,#f0cf7a);margin-top:5px}
.low{color:#e57a6a;font-weight:600}
.bar-r{margin-bottom:14px;font-size:14px}
.bar-r span{color:var(--mu);float:right}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.hd h1{margin:0}
.msg{color:var(--ok);font-size:13px;margin-left:10px}
@media(max-width:820px){
.menu{display:block}
nav{position:fixed;left:0;top:calc(59px + env(safe-area-inset-top,0px));bottom:0;z-index:4;transform:translateX(-100%);transition:transform .2s;min-height:0}
nav.open{transform:none}
.cards{grid-template-columns:1fr 1fr}
.g2{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
</style></head>
<body>
<header class="top">
<button class="menu" id="mb" aria-label="Menu">☰</button>
<svg width="46" height="42" viewBox="0 0 60 54" role="img" aria-label="SR"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0cf7a"/><stop offset="1" stop-color="#b8861f"/></linearGradient></defs><text x="2" y="34" font-family="Cormorant Garamond,Georgia,serif" font-size="42" font-weight="700" fill="url(#g)">S</text><text x="20" y="49" font-family="Cormorant Garamond,Georgia,serif" font-size="42" font-weight="700" fill="url(#g)">R</text></svg>
<div class="brand"><b>SAREXBD</b><small>Admin Panel</small></div>
<div class="adm">👤 Admin</div>
</header>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const MENU=[["dash","ড্যাশবোর্ড","Dashboard","▦"],["prod","পণ্য","Products","👜"],["ord","অর্ডার","Orders","🧾"],["cust","কাস্টমার","Customers","👥"],["stock","স্টক","Stock","📦"],["coup","কুপন","Coupons","🏷"],["rep","রিপোর্ট","Reports","📈"],["set","সেটিংস","Settings","⚙"],["out","লগআউট","Logout","⎋"]];
const ST={p:["পেন্ডিং","t-w"],r:["প্রসেসিং","t-i"],d:["ডেলিভার্ড","t-ok"]};
const KEY="sarexbd_admin_v1";
let D=null;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D)D={prods:[{id:1,n:"Leather Wallet",c:"Wallet",p:1200,s:14},{id:2,n:"Leather Belt",c:"Belt",p:1000,s:8},{id:3,n:"Leather Bag",c:"Bag",p:3500,s:3},{id:4,n:"Leather Jacket",c:"Jacket",p:6500,s:5}],
ords:[{id:"#ORD-001",cu:"Rahim Ahmed",ph:"01711000001",pr:"Leather Wallet",a:1200,d:"12 Oct",st:"p"},{id:"#ORD-002",cu:"Karim Uddin",ph:"01811000002",pr:"Leather Bag",a:2500,d:"10 Oct",st:"d"},{id:"#ORD-003",cu:"Nusrat Jahan",ph:"01911000003",pr:"Leather Belt",a:1000,d:"08 Oct",st:"r"},{id:"#ORD-004",cu:"Rahim Ahmed",ph:"01711000001",pr:"Leather Belt",a:1000,d:"05 Oct",st:"d"}],
coups:[{c:"WELCOME10",o:10,on:true},{c:"EID25",o:25,on:false}],
set:{name:"SAREXBD",ph:"+880 17XX-XXXXXX",em:"support@sarexbd.com",dh:80,out:130}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),nav=$("nav"),main=$("main");
const tk=n=>"৳"+Number(n).toLocaleString();
let cur="dash",edit=null,note="";
const inp=(l,id,val,t="text")=>`<label class="f">${l}<input id="${id}" type="${t}" value="${val??""}"></label>`;
const tbl=(h,r,e)=>r.length?`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.join("")}</table></div>`:`<div class="card empty">${e}</div>`;
const tag=s=>`<span class="tag ${ST[s][1]}">${ST[s][0]}</span>`;
const sales=()=>D.ords.reduce((a,o)=>a+o.a,0);
function drawNav(){nav.innerHTML=MENU.map(m=>`<a tabindex="0" role="button" data-k="${m[0]}" class="${m[0]==cur?"on":""}"><span>${m[3]}</span><span>${m[1]}<small>${m[2]}</small></span></a>`).join("")}
const orow=o=>`<tr><td>${o.id}</td><td>${o.pr}</td><td>${tk(o.a)}</td><td>${o.d}</td><td>${tag(o.st)}</td></tr>`;
const P={
dash(){const pend=D.ords.filter(o=>o.st=="p").length,low=D.prods.filter(p=>p.s<5).length;
const S=[["মোট পণ্য","Total Products",D.prods.length],["মোট অর্ডার","Total Orders",D.ords.length],["মোট বিক্রি","Total Sales",tk(sales())],["পেন্ডিং অর্ডার","Pending Orders",pend]];
return `<div class="cards">${S.map(s=>`<div class="card"><small>${s[0]} / ${s[1]}</small><b>${s[2]}</b></div>`).join("")}</div>${low?`<p class="low" style="margin-top:14px">⚠ ${low}টি পণ্যের স্টক কম আছে</p>`:""}<h2>সাম্প্রতিক অর্ডার / Recent Orders</h2>`+tbl(["#","পণ্য","মূল্য","তারিখ","অবস্থা"],D.ords.slice(0,5).map(orow),"কোনো অর্ডার নেই।")},
prod(){let f="";if(edit){const p=edit=="new"?{}:D.prods.find(x=>x.id==edit);
f=`<div class="card" style="margin-bottom:14px"><div class="g2">${inp("পণ্যের নাম / Name","pn",p.n)}${inp("ক্যাটাগরি / Category","pc",p.c)}${inp("মূল্য / Price (৳)","pp",p.p,"number")}${inp("স্টক / Stock","ps",p.s,"number")}</div><button class="btn" data-a="saveP">সংরক্ষণ করুন</button> <button class="gh" data-a="cancel">বাতিল</button></div>`}
return `<div class="hd"><span></span><button class="btn" data-a="new">+ নতুন পণ্য</button></div>${f}`+tbl(["নাম","ক্যাটাগরি","মূল্য","স্টক",""],D.prods.map(p=>`<tr><td>${p.n}</td><td>${p.c}</td><td>${tk(p.p)}</td><td>${p.s}</td><td><button class="gh" data-a="ed" data-i="${p.id}">এডিট</button><button class="gh d" data-a="delP" data-i="${p.id}">মুছুন</button></td></tr>`),"কোনো পণ্য নেই। নতুন পণ্য যোগ করুন।")},
ord(){return tbl(["#","গ্রাহক","পণ্য","মূল্য","তারিখ","অবস্থা"],D.ords.map(o=>`<tr><td>${o.id}</td><td>${o.cu}<br><small style="color:var(--mu)">${o.ph}</small></td><td>${o.pr}</td><td>${tk(o.a)}</td><td>${o.d}</td><td><select data-o="${o.id}">${Object.keys(ST).map(k=>`<option value="${k}" ${k==o.st?"selected":""}>${ST[k][0]}</option>`).join("")}</select></td></tr>`),"কোনো অর্ডার নেই।")},
cust(){const m={};D.ords.forEach(o=>{const c=m[o.ph]||(m[o.ph]={n:o.cu,ph:o.ph,k:0,t:0});c.k++;c.t+=o.a});
return tbl(["নাম","ফোন","অর্ডার","মোট খরচ"],Object.values(m).map(c=>`<tr><td>${c.n}</td><td>${c.ph}</td><td>${c.k}</td><td>${tk(c.t)}</td></tr>`),"কোনো কাস্টমার নেই।")},
stock(){return tbl(["পণ্য","স্টক",""],D.prods.map(p=>`<tr><td>${p.n}</td><td class="${p.s<5?"low":""}">${p.s}${p.s<5?" (কম)":""}</td><td><button class="gh" data-a="stk" data-i="${p.id}" data-d="-1">−</button><button class="gh" data-a="stk" data-i="${p.id}" data-d="1">+</button></td></tr>`),"কোনো পণ্য নেই।")},
coup(){return `<div class="card" style="margin-bottom:14px"><div class="g2">${inp("কুপন কোড / Code","cc","")}${inp("ছাড় / Discount (%)","co","","number")}</div><button class="btn" data-a="saveC">কুপন যোগ করুন</button><span class="msg">${note}</span></div>`+tbl(["কোড","ছাড়","অবস্থা",""],D.coups.map((c,i)=>`<tr><td>${c.c}</td><td>${c.o}%</td><td><span class="tag ${c.on?"t-ok":"t-w"}">${c.on?"চালু":"বন্ধ"}</span></td><td><button class="gh" data-a="togC" data-i="${i}">${c.on?"বন্ধ করুন":"চালু করুন"}</button><button class="gh d" data-a="delC" data-i="${i}">মুছুন</button></td></tr>`),"কোনো কুপন নেই।")},
rep(){const m={};D.ords.forEach(o=>m[o.pr]=(m[o.pr]||0)+o.a);const mx=Math.max(1,...Object.values(m));
const cnt=k=>D.ords.filter(o=>o.st==k).length;
return `<div class="cards" style="grid-template-columns:repeat(3,1fr)">${Object.keys(ST).map(k=>`<div class="card"><small>${ST[k][0]}</small><b>${cnt(k)}</b></div>`).join("")}</div><h2>পণ্য অনুযায়ী বিক্রি / Sales by Product</h2><div class="card">${Object.keys(m).length?Object.keys(m).map(k=>`<div class="bar-r">${k}<span>${tk(m[k])}</span><div class="bar" style="width:${m[k]/mx*100}%"></div></div>`).join(""):"কোনো ডেটা নেই।"}</div><p style="margin-top:12px;color:var(--mu)">মোট বিক্রি: ${tk(sales())}</p>`},
set(){const s=D.set;return `<div class="card"><div class="g2">${inp("স্টোরের নাম","sn",s.name)}${inp("ফোন / WhatsApp","sp",s.ph)}${inp("ইমেইল","se",s.em)}<span></span>${inp("ঢাকায় ডেলিভারি চার্জ (৳)","sd",s.dh,"number")}${inp("ঢাকার বাইরে ডেলিভারি চার্জ (৳)","so",s.out,"number")}</div><button class="btn" data-a="saveS">সেটিংস সংরক্ষণ করুন</button><span class="msg">${note}</span></div>`},
out(){return `<div class="card empty">আপনি লগআউট হয়েছেন।<br><br><button class="btn" data-k="dash">আবার লগইন করুন</button></div>`}};
function draw(){const m=MENU.find(x=>x[0]==cur);drawNav();main.innerHTML=`<h1>${m[1]}<span>${m[2]}</span></h1>`+P[cur]();note=""}
function go(k){cur=k;edit=null;note="";nav.classList.remove("open");draw()}
const A={
new(){edit="new"},cancel(){edit=null},ed(i){edit=+i},
saveP(){const n=v("pn"),p=+v("pp");if(!n||!(p>0)){alert("নাম ও সঠিক মূল্য দিন");return}
const o={n,c:v("pc")||"Other",p,s:+v("ps")||0};if(edit=="new")D.prods.push({id:Date.now(),...o});else Object.assign(D.prods.find(x=>x.id==edit),o);edit=null;save()},
delP(i){if(confirm("পণ্যটি মুছবেন?")){D.prods=D.prods.filter(p=>p.id!=i);save()}},
stk(i,d){const p=D.prods.find(x=>x.id==i);p.s=Math.max(0,p.s+ +d);save()},
saveC(){const c=v("cc").toUpperCase(),o=+v("co");if(!c||!(o>0&&o<=100)){alert("কোড ও ১-১০০ এর মধ্যে ছাড় দিন");return}D.coups.push({c,o,on:true});save()},
togC(i){D.coups[i].on=!D.coups[i].on;save()},delC(i){D.coups.splice(i,1);save()},
saveS(){D.set={name:v("sn"),ph:v("sp"),em:v("se"),dh:+v("sd")||0,out:+v("so")||0};save();note="সংরক্ষিত হয়েছে"}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-k],[data-a]");if(!t)return;
if(t.dataset.k)return go(t.dataset.k);A[t.dataset.a](t.dataset.i,t.dataset.d);draw()});
document.addEventListener("change",e=>{const s=e.target.closest("[data-o]");if(s){D.ords.find(o=>o.id==s.dataset.o).st=s.value;save();draw()}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"){const t=e.target.closest("nav [data-k]");if(t)go(t.dataset.k)}});
$("mb").onclick=()=>nav.classList.toggle("open");
draw();
</script>
</body></html>
