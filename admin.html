<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SAREXBD Admin</title>
<script>
window.addEventListener("error",function(e){
 var m=document.getElementById("loginMessage");
 if(m)m.textContent="স্ক্রিপ্ট এরর: "+(e.message||"অজানা");
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"><\/script>');

<style>
:root{--gold:#d4af37;--bg:#0b0b0d;--card:#171719;--line:#333337;--white:#f7f7f7;--muted:#aaaab2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:"Noto Sans Bengali","Hind Siliguri",Arial,sans-serif;line-height:1.5}
header{padding:16px;background:#111;border-bottom:1px solid #493d1c}
main{max-width:1100px;margin:auto;padding:16px}
.logo{font-size:25px;font-weight:bold;color:var(--gold)}
.logo span{color:#fff}
button{padding:11px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px;font-family:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
button:hover:not(:disabled),.btnlink:hover{filter:brightness(1.12)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.btnlink:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gold{background:var(--gold);color:#111}
.dark{background:#29292d;color:#fff;border:1px solid #444}
.danger{background:#4a1c1c;color:#ffb4b4;border:1px solid #7a2c2c}
.btnlink{display:inline-block;padding:11px 14px;border-radius:8px;font-weight:bold;margin:3px;text-decoration:none;font-size:13.33px}
input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;background:#101012;color:#fff;border:1px solid #45454b;border-radius:8px;font-family:inherit}
label{font-size:13px;color:#ddd}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product img{width:100%;height:160px;object-fit:cover;border-radius:8px;background:#222}
.product h3{margin:9px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#29292d;border:1px solid #444;margin-right:4px}
.badge.warn{background:#4a3a0f;border-color:#8a6d1f;color:#ffd978}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:22px;color:var(--gold)}
.stat span{font-size:13px;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.zone{margin-top:8px}
#message{white-space:pre-wrap;color:#f3dc91}
hr{border-color:var(--line)}
@media(max-width:600px){.row,.products,.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:10px}}
</style>
</head>
<body>
<header>
 <div class="logo">SAREX<span>BD</span></div>
 <p class="muted">ADMIN · PRODUCTS · ORDERS</p>
 <button id="logout" class="dark hidden" type="button">Logout</button>
</header>
<main>
 <section id="login" class="card">
  <h2>Admin Login</h2>
  <form id="loginForm" onsubmit="return false">
   <label for="email">Email</label>
   <input id="email" type="email" autocomplete="username" required>
   <label for="password">Password</label>
   <input id="password" type="password" autocomplete="current-password" required>
   <button class="gold" type="submit">Login</button>
  </form>
  <p id="loginMessage" role="status"></p>
 </section>

 <section id="dashboard" class="hidden">
  <h2>সারসংক্ষেপ</h2>
  <div class="stats">
   <div class="stat"><b id="stToday">0</b><span>আজকের অর্ডার</span></div>
   <div class="stat"><b id="stTodaySales">৳0</b><span>আজকের বিক্রি</span></div>
   <div class="stat"><b id="stMonthSales">৳0</b><span>এই মাসের বিক্রি</span></div>
   <div class="stat"><b id="stPending">0</b><span>পেন্ডিং অর্ডার</span></div>
   <div class="stat"><b id="stLow">0</b><span>কম স্টকের প্রোডাক্ট</span></div>
  </div>
  <p id="lowList" class="muted"></p>
  <p id="statsNote" class="muted"></p>

  <h2>প্রোডাক্ট যোগ / এডিট</h2>
  <div class="card">
   <form id="productForm">
    <input id="productId" type="hidden">
    <label for="name">প্রোডাক্টের নাম</label>
    <input id="name" required maxlength="150" placeholder="Premium Leather Wallet">
    <label for="description">বিবরণ</label>
    <textarea id="description" rows="3" maxlength="2000" placeholder="প্রোডাক্টের বিবরণ"></textarea>
    <div class="row">
     <div><label for="price">দাম (৳)</label><input id="price" type="number" min="0" step="0.01" required></div>
     <div><label for="stock">স্টক</label><input id="stock" type="number" min="0" step="1" required></div>
    </div>
    <label for="image">প্রোডাক্টের ছবি (JPG, PNG, WEBP · সর্বোচ্চ ৫ MB)</label>
    <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
    <p class="muted">নতুন ছবি না দিলে আগের ছবিই থাকবে।</p>
    <label><input id="active" type="checkbox" checked style="width:auto"> ওয়েবসাইটে দেখাবে</label>
    <p>
     <button class="gold" type="submit">Save Product</button>
     <button class="dark" id="cancelEdit" type="button">নতুন প্রোডাক্ট</button>
    </p>
   </form>
  </div>

  <h2>প্রোডাক্ট তালিকা</h2>
  <button class="dark" id="reloadProducts" type="button">Refresh Products</button>
  <div id="productList" class="products"></div>

  <hr>
  <h2>অর্ডার ম্যানেজমেন্ট</h2>
  <form id="orderFilter" class="card" onsubmit="return false">
   <div class="toolbar">
    <div>
     <label for="orderSearch">খোঁজো (নাম / ফোন / পণ্য / অর্ডার নম্বর)</label>
     <input id="orderSearch" type="search" placeholder="যেমন: 01712 বা রহিম">
    </div>
    <div>
     <label for="orderStatus">স্ট্যাটাস</label>
     <select id="orderStatus"><option value="">সব</option></select>
    </div>
   </div>
   <button class="gold" type="submit">খুঁজুন</button>
   <button class="dark" id="clearFilter" type="button">রিসেট</button>
   <button class="dark" id="reloadOrders" type="button">Refresh Orders</button>
   <button class="dark" id="exportOrders" type="button">CSV ডাউনলোড</button>
  </form>
  <p id="orderMessage" class="muted" role="status"></p>
  <div id="orderList"></div>
  <button class="dark hidden" id="moreOrders" type="button">আরও অর্ডার দেখাও</button>

  <hr>
  <h2>সেটিংস</h2>
  <div class="card">
   <form id="settingsForm" onsubmit="return false">
    <label for="setShop">দোকানের নাম</label>
    <input id="setShop" maxlength="60">
    <label for="setWa">দোকানের WhatsApp/ফোন নম্বর (ইনভয়েসে দেখাবে)</label>
    <input id="setWa" inputmode="tel" maxlength="20">
    <label for="setAddr">ঠিকানা (খালি রাখলে ইনভয়েসে দেখাবে না)</label>
    <input id="setAddr" maxlength="200">
    <div class="row">
     <div><label for="setIn">ডেলিভারি চার্জ: ঢাকার ভেতরে (৳)</label><input id="setIn" type="number" min="0" step="1"></div>
     <div><label for="setOut">ডেলিভারি চার্জ: ঢাকার বাইরে (৳)</label><input id="setOut" type="number" min="0" step="1"></div>
    </div>
    <label for="setLow">কম স্টকের সীমা (এর সমান বা কম হলে সতর্ক করবে)</label>
    <input id="setLow" type="number" min="0" step="1">
    <button class="gold" type="submit">Save Settings</button>
    <button class="dark" id="resetSettings" type="button">ডিফল্টে ফেরাও</button>
   </form>
   <p id="settingsMessage" class="muted" role="status"></p>
   <p class="muted">এই সেটিংস শুধু এই ফোন/ব্রাউজারে সেভ থাকে।</p>
  </div>
 </section>
 <p id="message" role="status"></p>
</main>

<script>
const SUPABASE_URL="https://kkjyhhxkdgcbtwysftjt.supabase.co";
const SUPABASE_KEY="sb_publishable_FLYJFyWSJd2-_KVSy_ZMRA_cv9vRKs1";
const BUCKET="product-images";
const ORDERS_PER_PAGE=20;
const MAX_IMAGE_BYTES=5*1024*1024;
const IMAGE_TYPES={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"};
const STATUSES=["Pending","Confirmed","Shipped","Delivered","Cancelled"];

/* ---------- সেটিংস (এই ব্রাউজারে সেভ থাকে) ---------- */
const DEFAULTS={shopName:"SAREXBD",whatsapp:"01610244533",address:"",deliveryInside:80,deliveryOutside:120,lowStock:5};
const SETTINGS_KEY="sarexbd_admin_settings_v1";
function loadSettings(){
 const s=Object.assign({},DEFAULTS);
 try{
  const raw=localStorage.getItem(SETTINGS_KEY);
  if(raw){
   const o=JSON.parse(raw);
   if(typeof o.shopName==="string"&&o.shopName.trim())s.shopName=o.shopName.trim();
   if(typeof o.whatsapp==="string")s.whatsapp=o.whatsapp.trim();
   if(typeof o.address==="string")s.address=o.address.trim();
   ["deliveryInside","deliveryOutside","lowStock"].forEach(k=>{
    const n=Number(o[k]);
    if(Number.isFinite(n)&&n>=0)s[k]=n;
   });
  }
 }catch(e){}
 return s;
}
function persistSettings(){
 try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(S));return true}catch(e){return false}
}
let S=loadSettings();

if(!window.supabase){
 document.getElementById("loginMessage").textContent="Supabase লাইব্রেরি লোড হয়নি। নেট চেক করো, VPN/ডেটা সেভার বন্ধ করো বা অন্য নেটওয়ার্কে চেষ্টা করো।";
 throw new Error("supabase library missing");
}
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let products=[];
let statOrders=[];
let orderCount=0;
let shownFor=null;

function money(v){return "৳"+(Number(v)||0).toLocaleString("en-US")}
function showMessage(s){$("message").textContent=s}
function errText(e){return (e&&e.message)||String(e)}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
// বাংলাদেশি নম্বরকে WhatsApp/কলের জন্য 8801XXXXXXXXX আকারে আনে
function bdPhone(p){
 const d=String(p||"").replace(/\D/g,"");
 if(!d)return "";
 if(d.startsWith("880"))return d;
 if(d.startsWith("0"))return "88"+d;
 if(d.length===10&&d.startsWith("1"))return "880"+d;
 return d;
}

function storagePath(url){
 const part=(url||"").split("/"+BUCKET+"/")[1];
 return part?decodeURIComponent(part.split("?")[0]):null;
}
async function removeImage(url){
 const path=storagePath(url);
 if(!path)return;
 const {error}=await db.storage.from(BUCKET).remove([path]);
 if(error)console.warn("পুরনো ছবি মোছা যায়নি:",error.message);
}

/* ---------- লগইন / সেশন ---------- */
function applySession(session){
 const logged=!!session;
 $("login").classList.toggle("hidden",logged);
 $("dashboard").classList.toggle("hidden",!logged);
 $("logout").classList.toggle("hidden",!logged);
 const uid=logged?session.user.id:null;
 if(uid===shownFor)return;
 shownFor=uid;
 if(logged){
  fillSettingsForm();
  loadProducts();
  loadOrders(true);
  loadStats();
 }else{
  products=[];
  statOrders=[];
  $("productList").replaceChildren();
  $("orderList").replaceChildren();
  showMessage("");
 }
}
db.auth.onAuthStateChange((event,session)=>{
 setTimeout(()=>applySession(session),0);
});

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=$("loginForm").querySelector("button");
 btn.disabled=true;
 $("loginMessage").textContent="লগইন হচ্ছে...";
 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 btn.disabled=false;
 if(error){$("loginMessage").textContent="লগইন হয়নি: "+error.message;return}
 $("loginMessage").textContent="";
 $("password").value="";
});
$("logout").onclick=async()=>{await db.auth.signOut()};

/* ---------- সারসংক্ষেপ ---------- */
async function loadStats(){
 // সর্বশেষ ১০০০টি অর্ডার থেকে হিসাব (ছোট দোকানের জন্য যথেষ্ট)
 const {data,error}=await db.from("orders").select("created_at,total,status")
  .order("created_at",{ascending:false}).limit(1000);
 if(error){$("statsNote").textContent="সারসংক্ষেপ লোড হয়নি: "+error.message;return}
 statOrders=data||[];
 $("statsNote").textContent=statOrders.length>
