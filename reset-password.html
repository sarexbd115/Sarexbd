<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAREXBD Password Reset</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0b0b0d;color:white;font-family:Arial;padding:25px}
.box{max-width:400px;margin:50px auto;background:#171719;padding:22px;border-radius:12px}
h2{color:#d4af37}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:10px 0;border-radius:7px}
input{background:#222;color:white;border:1px solid #555}
button{background:#d4af37;border:0;font-weight:bold}
#msg{white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h2>SAREXBD</h2>
<h3>নতুন পাসওয়ার্ড সেট করো</h3>
<form id="form">
<input id="password" type="password" minlength="8"
placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)" required>
<input id="confirm" type="password" minlength="8"
placeholder="আবার পাসওয়ার্ড লেখো" required>
<button type="submit">পাসওয়ার্ড পরিবর্তন</button>
</form>
<p id="msg">পাসওয়ার্ড রিসেট লিংক যাচাই হচ্ছে...</p>
</div>
<script>
const db = window.supabase.createClient(
 "https://kkjyhhxkdgcbtwysftjt.supabase.co",
 "sb_publishable_FLYJFyWSJd2-_KVSy_ZMRA_cv9vRKs1"
);

const msg = document.getElementById("msg");

(async()=>{
 const {data,error}=await db.auth.getSession();
 if(error || !data.session){
   msg.textContent="রিসেট লিংক কাজ করছে না বা মেয়াদ শেষ। নতুন রিসেট ইমেইল পাঠাতে হবে।";
 }else{
   msg.textContent="নতুন পাসওয়ার্ড লিখো।";
 }
})();

document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const p=document.getElementById("password").value;
 const c=document.getElementById("confirm").value;

 if(p!==c){
   msg.textContent="দুটি পাসওয়ার্ড মিলছে না।";
   return;
 }
 if(p.length<8){
   msg.textContent="কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দাও।";
   return;
 }

 msg.textContent="পাসওয়ার্ড পরিবর্তন হচ্ছে...";
 const {error}=await db.auth.updateUser({password:p});

 if(error){
   msg.textContent="সমস্যা হয়েছে: "+error.message;
 }else{
   msg.textContent="পাসওয়ার্ড পরিবর্তন হয়েছে! এখন Admin পেজে গিয়ে নতুন পাসওয়ার্ড দিয়ে লগইন করো।";
   document.getElementById("form").reset();
 }
});
</script>
</body>
</html>
